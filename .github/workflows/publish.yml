name: Publish

# A v*.*.* tag releases the Python package. The version lives in one place,
# python/src/xlide_mcp/_version.py, and a tag that disagrees with it stops the
# build rather than publishing a distribution whose number is a guess.
#
# Started by hand, this is always a dry run: it builds,
# scans and assembles the release files exactly as a release would, and
# uploads them as the release-preview artifact instead of publishing anything.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      # First, and before anything is installed, so a mistyped tag fails in
      # seconds. _version.py imports nothing, so reading it needs no install.
      # A manual run has no tag to check: it builds and validates, and the two
      # jobs below it do not run, which makes it a dry run of the release.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import runpy; print(runpy.run_path('src/xlide_mcp/_version.py')['__version__'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "ERROR: tag '$TAG' does not match _version.py '$PKG'"
            exit 1
          fi
          echo "Version check passed: $PKG"

      - name: Install
        run: |
          python -m pip install --require-hashes -r ../.github/requirements/test.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Test
        run: python -m pytest

      # A release whose tool surface does not match its generated artifacts is
      # one every port would be verified against wrongly, so it does not ship.
      - name: Contract is current
        run: |
          python tools/export_contract.py --check
          python tools/export_conformance.py --check

      - name: Install build tooling
        run: python -m pip install --require-hashes -r ../.github/requirements/build.txt

      - name: Build sdist and wheel
        run: python -m build --no-isolation

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # An action path is relative to the workspace, not to the job's
          # working-directory.
          name: dist
          path: python/dist/
          if-no-files-found: error

  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  malware-scan:
    name: Malware scan
    uses: ./.github/workflows/malware-scan.yml
    permissions:
      contents: read

  publish:
    name: Publish to PyPI
    needs: [build, security, malware-scan]
    if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/xlide-mcp/
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). No token is stored anywhere.
      id-token: write
      attestations: write # store the provenance attestation
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Signed build provenance: `gh attestation verify <file> --owner
      # WilliamSmithEdward` shows which commit and run built a distribution.
      - name: Attest the distributions
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      # The signed bundle goes on the GitHub release too, so a download can be
      # checked offline: gh attestation verify <file> --bundle <bundle>.
      - name: Keep the provenance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  registry:
    name: Publish to the MCP Registry
    # After PyPI, and only after. The registry validates ownership by fetching
    # the package's description from PyPI and looking for the `mcp-name` marker
    # in it, so a registry publish that ran first would fail on a package that
    # does not exist yet.
    needs: publish
    if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    permissions:
      # OIDC is how mcp-publisher proves the io.github.WilliamSmithEdward
      # namespace. No token and no secret.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # An exact release, checked against the SHA-256 GitHub records for the
      # asset. No updater follows a release download: to move it, take a
      # release of modelcontextprotocol/registry at least a week old and its
      # mcp-publisher_linux_amd64.tar.gz digest from
      # gh api repos/modelcontextprotocol/registry/releases/tags/<tag>.
      - name: Install mcp-publisher
        env:
          VERSION: v1.8.1
          SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate
        run: ./mcp-publisher login github-oidc

      # PyPI serves a new release's description a moment after the upload
      # returns, and the registry reads it to find the ownership marker.
      - name: Wait for PyPI to serve the new version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 10); do
            if curl -sf "https://pypi.org/pypi/xlide-mcp/$VERSION/json" > /dev/null; then
              echo "PyPI is serving $VERSION"
              exit 0
            fi
            echo "attempt $attempt: not there yet"
            sleep 15
          done
          echo "ERROR: PyPI never served $VERSION"
          exit 1

      - name: Publish
        run: ./mcp-publisher publish

  # On a dry run `publish` is skipped; this job still assembles the release
  # and uploads it as an artifact, and only the last step is skipped.
  github-release:
    name: Create GitHub release
    needs: [build, publish, security, malware-scan]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
      && needs.security.result == 'success' && needs.malware-scan.result == 'success'
      && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Download security report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-report
          path: security-report/

      - name: Download malware report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: malware-report
          path: security-report/

      - name: Download the provenance bundle
        if: env.DRY_RUN != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance
          path: provenance/

      - name: Name security files after the release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$DRY_RUN" = true ]; then VERSION=$(python3 -c "import runpy; print(runpy.run_path('python/src/xlide_mcp/_version.py')['__version__'])"); fi
          for file in security-report/*; do
            mv "$file" "security-report/xlide-mcp-$VERSION-$(basename "$file")"
          done
          if [ "$DRY_RUN" != true ]; then
            test "$(find provenance -type f | wc -l)" = 1
            mv provenance/* "provenance/xlide-mcp-$VERSION.sigstore.json"
          fi

      - name: Extract changelog section for this tag
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$DRY_RUN" = true ]; then TAG=$(python3 -c "import runpy; print(runpy.run_path('python/src/xlide_mcp/_version.py')['__version__'])"); fi
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$TAG" '
              $0 ~ "^## \\[" ver "\\]" { capture=1; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' CHANGELOG.md > release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            echo "Release $TAG" > release_notes.md
          fi
          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Keep what the release would carry
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preview
          path: |
            dist/
            security-report/
            release_notes.md
          if-no-files-found: error

      - name: Create GitHub release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # The title is the tag and nothing else. The headline is in the body.
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: |
            dist/*
            security-report/*
            provenance/*
          fail_on_unmatched_files: true
