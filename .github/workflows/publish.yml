name: Publish to PyPI

# A v*.*.* tag releases the Python package. The version lives in one place,
# python/src/xlide_mcp/_version.py, and a tag that disagrees with it stops the
# build rather than publishing a distribution whose number is a guess.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # First, and before anything is installed, so a mistyped tag fails in
      # seconds. _version.py imports nothing, so reading it needs no install.
      # A manual run has no tag to check: it builds and validates, and the two
      # jobs below it do not run, which makes it a dry run of the release.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import runpy; print(runpy.run_path('src/xlide_mcp/_version.py')['__version__'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "ERROR: tag '$TAG' does not match _version.py '$PKG'"
            exit 1
          fi
          echo "Version check passed: $PKG"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      # A release whose tool surface does not match its generated artifacts is
      # one every port would be verified against wrongly, so it does not ship.
      - name: Contract is current
        run: |
          python tools/export_contract.py --check
          python tools/export_conformance.py --check

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # An action path is relative to the workspace, not to the job's
          # working-directory.
          name: dist
          path: python/dist/
          if-no-files-found: error

  security:
    name: Security scans
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  publish:
    name: Publish to PyPI
    needs: [build, security]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/xlide-mcp/
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). No token is stored anywhere.
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  registry:
    name: Publish to the MCP Registry
    # After PyPI, and only after. The registry validates ownership by fetching
    # the package's description from PyPI and looking for the `mcp-name` marker
    # in it, so a registry publish that ran first would fail on a package that
    # does not exist yet.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      # OIDC is how mcp-publisher proves the io.github.WilliamSmithEdward
      # namespace. No token and no secret.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate
        run: ./mcp-publisher login github-oidc

      # PyPI serves a new release's description a moment after the upload
      # returns, and the registry reads it to find the ownership marker.
      - name: Wait for PyPI to serve the new version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 10); do
            if curl -sf "https://pypi.org/pypi/xlide-mcp/$VERSION/json" > /dev/null; then
              echo "PyPI is serving $VERSION"
              exit 0
            fi
            echo "attempt $attempt: not there yet"
            sleep 15
          done
          echo "ERROR: PyPI never served $VERSION"
          exit 1

      - name: Publish
        run: ./mcp-publisher publish

  github-release:
    name: Create GitHub Release
    needs: [publish, security]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Download security report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-report
          path: security-report/

      - name: Name security files after the release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for file in security-report/*; do
            mv "$file" "security-report/xlide-mcp-$VERSION-$(basename "$file")"
          done

      - name: Extract changelog section for this tag
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$TAG" '
              $0 ~ "^## \\[" ver "\\]" { capture=1; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' CHANGELOG.md > release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            echo "Release $TAG" > release_notes.md
          fi
          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # The title is the tag and nothing else. The headline is in the body.
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: |
            dist/*
            security-report/*
          fail_on_unmatched_files: true
