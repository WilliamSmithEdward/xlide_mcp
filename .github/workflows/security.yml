name: Security

# CodeQL and Semgrep over the server and the workflows that build and
# publish it, and ClamAV and YARA-X over every tracked file for malware and
# suspicious content. scripts/security/security_report.py then holds every
# finding, and every warning a tool raises about its scan, to
# .github/security/accepted.toml, and fails on anything that file does not
# account for. The publish workflow calls this one, so a release waits on
# it and carries the report it writes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily, so new signatures, rules and queries reach files that have
    # not changed.
    - cron: "23 5 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          output: sarif

      - name: Name the SARIF after its scan
        env:
          LANGUAGE: ${{ matrix.language }}
        run: mv sarif/*.sarif "codeql-$LANGUAGE.sarif"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-codeql-${{ matrix.language }}
          path: codeql-${{ matrix.language }}.sarif
          if-no-files-found: error

  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install -r .github/security/requirements.txt

      # --metrics=off: nothing about the scan leaves the runner.
      # --disable-nosem: a `nosemgrep` comment cannot hide a finding, so
      # accepting one goes through .github/security/accepted.toml. The long
      # timeout lets every rule finish on the largest files, since a rule
      # that times out has not checked that file.
      - name: Scan
        run: >-
          semgrep scan --metrics=off --disable-version-check --disable-nosem
          --strict --timeout 120 --timeout-threshold 0
          --config p/default --config p/python --config p/security-audit
          --config p/secrets --config p/github-actions
          --sarif-output=semgrep.sarif
          python/src python/tools .github scripts/security

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sarif-semgrep
          path: semgrep.sarif
          if-no-files-found: error

  malware:
    name: ClamAV + YARA-X
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Exactly the tracked files, as a release's source is: nothing the
      # runner or an earlier step left in the checkout.
      - name: Take the tracked files
        run: |
          mkdir scan-tree malware
          git archive HEAD | tar -x -C scan-tree

      # The image is pinned; the signatures are not. freshclam fetches and
      # verifies today's on every run, and the version scanned with lands in
      # the report.
      - name: ClamAV
        run: |
          docker build -q -t xlide-clamav .github/security/clamav
          docker run --rm --entrypoint sh \
            -v "$PWD/scan-tree:/scan:ro" -v "$PWD/malware:/out" \
            -v "$PWD/.github/security/clamav/scan.sh:/scan.sh:ro" \
            xlide-clamav /scan.sh
          version="$(sed 's/^ClamAV //' malware/clamav-version.txt 2>/dev/null || echo unknown)"
          python scripts/security/malware_sarif.py clamav malware/clamav.log \
            --version "$version" --errors malware/clamav.err \
            --status "$(cat malware/clamav.status)" --root scan-tree --out clamav.sarif

      # The scanner and the rules are both exact releases, checked against the
      # SHA-256 GitHub records for each asset, from .github/security/yara.env.
      - name: YARA-X with the YARA Forge rules
        run: |
          set -a; . .github/security/yara.env; set +a
          base=https://github.com
          curl -fsSL -o yr.tgz \
            "$base/VirusTotal/yara-x/releases/download/$YARA_X_VERSION/yara-x-$YARA_X_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$YARA_X_SHA256  yr.tgz" | sha256sum -c -
          curl -fsSL -o forge.zip \
            "$base/YARAHQ/yara-forge/releases/download/$YARA_FORGE_RELEASE/yara-forge-rules-full.zip"
          echo "$YARA_FORGE_SHA256  forge.zip" | sha256sum -c -
          tar -xzf yr.tgz yr
          unzip -q forge.zip -d forge
          # -w: the warnings are about the rules' own style, not this code.
          ./yr compile -w forge/packages/full/yara-rules-full.yar -o rules.yarc
          status=0
          ./yr scan --compiled-rules -r -o ndjson rules.yarc scan-tree \
            > malware/yara.ndjson 2> malware/yara.err || status=$?
          python scripts/security/malware_sarif.py yara malware/yara.ndjson \
            --version "$YARA_X_VERSION, YARA Forge full $YARA_FORGE_RELEASE" \
            --errors malware/yara.err --status "$status" --root scan-tree --out yara-x.sarif

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-malware
          path: |
            clamav.sarif
            yara-x.sarif
          if-no-files-found: error

  report:
    name: Security report
    if: always()
    needs: [codeql, semgrep, malware]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: sarif-*
          path: security-report
          merge-multiple: true

      - name: Hold the findings to the accepted list
        env:
          CODEQL_JOB_RESULT: ${{ needs.codeql.result }}
          SEMGREP_JOB_RESULT: ${{ needs.semgrep.result }}
          MALWARE_JOB_RESULT: ${{ needs.malware.result }}
        run: |
          mkdir -p security-report
          python scripts/security/security_report.py security-report \
            --accepted .github/security/accepted.toml \
            --out security-report/security-report.md \
            --require codeql-python --require codeql-actions --require semgrep \
            --require clamav --require yara-x

      - name: Show the report on the run
        if: always()
        run: |
          if [ -f security-report/security-report.md ]; then
            cat security-report/security-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-report
          path: security-report/
          if-no-files-found: error
