# Dependabot proposes updates for the upstream libraries, CI actions, the
# build tools and the server image's Python base. update-images.yml moves
# the ClamAV and Semgrep images the scans run, because GitHub refuses
# Dependabot's updates of them. The
# YARA Forge rules have their own weekly updater, update-yara-rules.yml. Review upstream library PRs
# against the conformance corpus before merging; no update is automatic.
#
# A release waits a week before it is proposed, long enough for most
# hijacked or broken releases to be found and pulled first. Security
# updates do not wait.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # The Python base of the server image. Moving to a new Python minor version
  # is a deliberate change, so only 3.12 releases are proposed.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    ignore:
      - dependency-name: python
        versions: [">=3.13"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The build tools the Publish workflow installs, hash-locked in
  # .github/requirements.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude: [pyopenvba, pyofficeeditor, pyprettyvba, vba-reference, pyvbaanalysis, pyvbaharness, xlide-mcp]
    commit-message:
      prefix: ci
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude: [pyopenvba, pyofficeeditor, pyprettyvba, vba-reference, pyvbaanalysis, pyvbaharness, xlide-mcp]
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
