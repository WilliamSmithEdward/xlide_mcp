# Dependabot proposes updates for the upstream libraries, CI actions, the
# Semgrep version and the ClamAV image used by the Security workflow. The
# YARA Forge rules have their own weekly updater, yara-forge-update.yml. Review upstream library PRs
# against the conformance corpus before merging; no update is automatic.
#
# A release waits a week before it is proposed, long enough for most
# hijacked or broken releases to be found and pulled first. Security
# updates do not wait.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /.github/security/clamav
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /.github/security
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
