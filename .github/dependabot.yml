# Dependabot proposes updates for the upstream libraries, CI actions, the
# build tools, the server image's Python base and the Semgrep and ClamAV
# images the scans run. The
# YARA Forge rules have their own weekly updater, update-yara-rules.yml. Review upstream library PRs
# against the conformance corpus before merging; no update is automatic.
#
# A release waits a week before it is proposed, long enough for most
# hijacked or broken releases to be found and pulled first. Security
# updates do not wait.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # The Python base of the server image. Moving to a new Python minor version
  # is a deliberate change, so only 3.12 releases are proposed.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    ignore:
      - dependency-name: python
        versions: [">=3.13"]

  # The Semgrep and ClamAV images the scans run, each pinned by digest in a
  # one-line Dockerfile.
  - package-ecosystem: docker
    directories:
      - /.github/security/semgrep
      - /.github/security/clamav
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  # The build tools the Publish workflow installs, hash-locked in
  # .github/requirements.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
